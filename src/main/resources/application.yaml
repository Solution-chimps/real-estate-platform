spring:
  application:
    name: real-estate-platform
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        timezone:
          default_storage: NORMALIZE_UTC
  flyway:
    placeholders:
      timestampType: TIMESTAMP(6)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  docker:
    compose:
      enabled: false

server:
  port: ${APP_PORT:8443}
  ssl:
    enabled: ${APP_SSL_ENABLED:true}
    key-store: ${APP_SSL_KEYSTORE:./data/dev-keystore.p12}
    key-store-password: ${APP_SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    whitelabel:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    jwt-secret: ${APP_JWT_SECRET:}
    token-ttl: PT8H
    cookie-name: constantino_session
    cookie-secure: true
    max-login-attempts: 5
    login-lock-duration: PT15M
    mfa-cookie-name: constantino_mfa
    mfa-challenge-ttl: PT5M
    mfa-encryption-key: ${APP_MFA_ENCRYPTION_KEY:}
    mfa-issuer: Constantino Imoveis
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    name: ${APP_ADMIN_NAME:Administrador}
    password: ${APP_ADMIN_PASSWORD:}
  storage:
    photos-dir: ${APP_PHOTOS_DIR:./data/photos}
